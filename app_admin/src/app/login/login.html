<div class="row card col-12 col-sm-8 col-md-6 col-lg-4 col-xl-3 mt-5 mx-auto">
  <h2 class="card-header">Login</h2>
  <div class="my-4">
    <form (ngSubmit)="onLoginSubmit()">
      <div role="alert" *ngIf="formError" class="alert alert-danger">
        {{ formError }}
      </div>
      <div class="form-group mb-3">
        <label for="name" class="form-label">Name</label>
        <input
          type="text"
          name="name"
          placeholder="Enter Name"
          [(ngModel)]="credentials.name"
          class="form-control"
        />
      </div>
      <div class="form-group mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          name="email"
          placeholder="Enter email address"
          [(ngModel)]="credentials.email"
          class="form-control"
        />
      </div>
      <div class="form-group mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="e.g 12+ alphanumerics"
          [(ngModel)]="credentials.password"
        />
      </div>
      <button type="submit" role="button" class="btn btn-primary mt-1">Sign In!</button>
    </form>
  </div>
</div>
