<div class="ps-2 pb-1 pt-2">
    <button (click)="addTrip()" class="btn btn-info ps-4 pe-4">Add Trip</button>
</div>
<div class="row mx-auto">
  <!-- https://stackoverflow.com/questions/78129406/the-ngfor-directive-was-used-in-the-template-but-neither-the-ngfor-directi -->
  @for (trip of trips; track trip.code) {
    <div class="col-12 col-md-6 col-xl-4 col-xxl-3 px-2 py-3">
      <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
    </div>
  }
</div>
