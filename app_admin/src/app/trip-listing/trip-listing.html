<div class="row mx-auto">
  <!-- https://stackoverflow.com/questions/78129406/the-ngfor-directive-was-used-in-the-template-but-neither-the-ngfor-directi -->
  @for (trip of trips; track trip.id) {
    <div class="col-12 col-sm-6 col-xl-4 col-xxl-3">
      <div class="card ml-4 mx-auto m-2" style="max-width: 28rem">
        <div class="card-header">{{ trip.name }}</div>
        <img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top" />
        <div class="card-body">
          <h6 class="card-subtitle mb-2 text-muted">
            {{ trip.resort }}
          </h6>
          <p class="card-subtitle mt-3 mb-3 text-muted">
            {{ trip.length }} only {{ trip.perPerson | currency: 'USD' : true }} per person
          </p>
          <p class="card-text" [innerHTML]="trip.description"></p>
        </div>
      </div>
    </div>
  }
</div>
